# Render Blueprint — deploys the Kotha Node backend as a Docker web service.
# In Render: New → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: kotha-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter          # paid, always-on (no cold-start spin-down)
    healthCheckPath: /api/health
    disk:
      name: kotha-data     # persistent disk so accounts survive restarts/redeploys
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR      # store the SQLite DB on the persistent disk
        value: /var/data
      # Set these in the Render dashboard (marked secret — not stored in git).
      - key: OPENAI_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
