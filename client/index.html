<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>কোথা — অনুশীলন</title>
    <script>
      // On-device error overlay: if startup JS throws, show it on screen instead of a white page.
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'boot-error';
            el.style.cssText = 'position:fixed;inset:0;margin:0;padding:16px;background:#7f1d1d;color:#fff;font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99999';
            document.body && document.body.appendChild(el);
          }
          el.textContent = 'App error:\n' + msg;
        }
        window.addEventListener('error', function (e) {
          show((e.message || e.error) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('Promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
